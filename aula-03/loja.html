<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
</head>

<style> 

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #333;
    }

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #333;
    color: white;
    padding: 10px 20px;
}   

nav ul {
    display: flex;
    list-style: none;
    gap: 20px;
}

nav a {
    color: white;
    text-decoration: none;
    animation: all 0.5s ease-in-out;
}

nav a:hover {
       animation: all 0.5s ease-in-out;
    color: rgb(250, 253, 255);
    border-bottom: 2px solid rgba(0, 183, 255, 0.521);
    border-radius: 4px;
    text-decoration: none;
}

/* Seção de produtos */
#produtos {
    width: 80%;
    margin: 40px auto;
    background-color: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

#produtos h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
}

/* Lista de produtos */
#produtos ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
}

#produtos ul li {
    background-color: #333;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    transition: 0.3s;
    cursor: pointer;
}

#produtos ul li:hover {
    background-color: #0d6efd;
    transform: translateY(-3px);
}

/* Tabela */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background-color: white;
}

table th {
    background-color: #333;
    color: white;
    padding: 12px;
}

table td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

table tbody tr:nth-child(even) {
    background-color: #f2f2f2;
}

table tbody tr:hover {
    background-color: #d9ecff;
    transition: 0.3s;
}

#cadastro {
    width: 80%;
    margin: 40px auto;
    background-color: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

#cadastro h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
}

#cadastro form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

#cadastro fieldset {
    border: 1px solid #ccc;
    padding: 15px 15px;
    border-radius: 8px;
}

#cadastro legend {
    font-weight: bold;
    color: #333;
}

#cadastro label {
    margin-bottom: 5px;
    color: #333;
}

#cadastro input, #cadastro select {
  padding: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 100%;
}

#cadastro button {
    padding: 10px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;

}

#cadastro button:hover {
    background-color: #0d6efd;
}

#cadastro input:focus, #cadastro select:focus {
    border-color: #0d6efd;
    outline: none;
}



</style>

<body>

    <header>
                  <h1>Loja</h1>
        <nav>
  
   <div class="nav-links">
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#produtos">Produtos</a></li>
            <li><a href="#cadastro">Cadastrar-se</a></li>
        </ul>
        </div>
        </nav>
    </header>

  
 </div>
   <section id="produtos">
    <h2>Produtos</h2>

    <ul>
        <li>Jaqueta</li>
        <li>Calça</li>
        <li>Camiseta</li>
    </ul>

    <table border="1">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Categoria</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Jaqueta de Couro</td>
                <td>R$ 250,00</td>
                <td>Jaqueta</td>
            </tr>
            <tr>
                <td>Calça Jeans</td>
                <td>R$ 150,00</td>
                <td>Calça</td>
            </tr>
            <tr>
                <td>Camiseta Polo</td>
                <td>R$ 100,00</td>
                <td>Camiseta</td>
            </tr>
        </tbody>
    </table>

   </section>

    <section id="cadastro">
    <h2>Cadastro</h2> <br>
    <form action="cadastro" method="post">Cadastra-se Aqui <br>
        <fieldset>
            <legend>Informações Pessoais</legend>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu E-mail" required>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8">
            </fieldset>
        <fieldset>

        <legend>Informações de Cadastro</legend>

        
        <label for="genero">Gênero</label>
        <select name="genero" id="genero">
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select>
        <button type="submit">Cadastrar</button>
    </form>
        </fieldset>
   </section>
    
   

</body>
</html>
