<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Serviços do Site da Escola</title>
</head>

<body>
    <header id="header">
        <h1>Escola Reinaldo Vaccari</h1>

        <nav aria-label="Menu Principal">
            <a href="index.html">Pagina Principal</a>
            <a href="servicos.html">Serviços</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>

    <section id="for-images">
        <img id="img1" src="img/reinaldo_vaccari.jpg" 
            alt="Logo da escola Reinaldo Vaccari" 
            width="400"
            height="250" 
            loading="lazy">

        <img id="img2" src="img/professoresreinaldovaccari.jpg"   
            alt="Estrutura da Escola Adjunto de um Funcionario da Prefeitura segurando ferramentas" 
            width="400"
            height="250" 
            loading="lazy">

        <img id="img3" src="img/imagem_da_estrutura_da_escola.jpg" 
            alt="Imagem da estrutura da escola Reinaldo Vaccari" 
            width="400"
            height="250" 
            loading="lazy">

        <img id="img4" src="img/festajuninareinaldovaccari.jpg" 
            alt="Professores do Reinaldo Vaccari na festa Junina" 
            width="400"
            height="250" 
            loading="lazy">
    </section>

    <section id="video">
        <video controls preload="metadata" 
        width="400" 
        height="250" 
        loading="lazy">
            <source src="img/video-escola.mp4" type="video/mp4"> Seu navegador não suporta o elemento de vídeo.
        </video>
    </section>

     <section id="audio">
        <audio controls preload="metadata" 
        width="400" 
        height="250" 
        loading="lazy">
        <source src="img/sinaldaescola.mp3" type="audio/mpeg"> Seu navegador não suporta o elemento de áudio.
        </audio>
   
           <section id="iframe">
               <iframe src="https://www.youtube.com/embed/2vxQhT_qfkA?si=tV4QFW3grgupjoUx" 
               width="400" 
               title="Video da Escola Reinaldo Vaccari"
               height="250" 
               loading="lazy">
            </iframe>
           </section>

     </section>
    <a href="https://github.com/bryanantonii/senai-codificacao-frontend" target="_blank">
        <footer>Desenvolvido por Bryan Eduardo & Henrique Guilherme</footer>
    </a>



</body>

</html>
